<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Iniciar Sesión - Tianguis Digital</title>
  <style>
    :root {
      --bg-page: #FBF4EA;
      --bg-card: #FFFFFF;
      --coral: #F7BFB6;
      --coral-active: #FF6F59;
      --text: #2B2B2B;
      --muted: #857F76;
      --border: #EDE3D4;
      --shadow: 0 12px 32px rgba(43,32,20,0.12);
      --ok-green: #25d366;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .logo-circle {
      width: 80px;
      height: 80px;
      background-color: var(--coral);
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .card h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .card .subtitle {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .input-wrap {
      position: relative;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      background-color: #FAFAFA;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    /* Espacio extra a la derecha para el botón de ver contraseña */
    .input-wrap .form-control.has-toggle {
      padding-right: 48px;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--coral-active);
      background-color: #FFF;
    }

    .form-control:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .toggle-pass {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      padding: 8px;
      cursor: pointer;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      border-radius: 8px;
    }
    .toggle-pass:hover { color: var(--text); }
    .toggle-pass:focus-visible {
      outline: 2px solid var(--coral-active);
      outline-offset: 2px;
    }

    .btn-login {
      width: 100%;
      background-color: var(--coral-active);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.2s ease;
      margin-top: 10px;
      font-family: inherit;
    }

    .btn-login:hover:not(:disabled) {
      filter: brightness(1.05);
    }

    .btn-login:disabled {
      cursor: not-allowed;
      opacity: 0.7;
      filter: none;
    }

    .btn-login.success {
      background-color: var(--ok-green);
    }

    .error-msg {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 15px;
      display: none;
      font-weight: 600;
      text-align: center;
    }

    .helper-text {
      margin-top: 22px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      text-align: center;
    }

    .helper-text strong {
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="card">
      <div class="logo-circle" aria-hidden="true">🏪</div>
      <h1>Tianguis Digital</h1>
      <p class="subtitle">Accede para administrar tu local</p>

      <form id="form-login" novalidate>

        <div class="form-group">
          <label for="usuario">Usuario del Local</label>
          <input
            type="text"
            id="usuario"
            class="form-control"
            placeholder="Ej. sneakers_roth"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              class="form-control has-toggle"
              placeholder="••••••••"
              autocomplete="current-password"
              required>
            <button
              type="button"
              class="toggle-pass"
              id="toggle-pass"
              aria-label="Mostrar contraseña"
              aria-pressed="false"
              title="Mostrar contraseña">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-login">Iniciar Sesión</button>
        <div id="error-msg" class="error-msg" role="alert" aria-live="polite"></div>
      </form>

      <p class="helper-text">
        ¿Olvidaste tu contraseña?<br>
        Contacta al <strong>administrador del tianguis</strong>.
      </p>
    </div>
  </div>

  <!-- Librería de Supabase (versión fijada) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <script>
    // ===== CONFIGURACIÓN =====
    const SUPABASE_URL = 'https://vjzbuxparhndkepfmhlt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqemJ1eHBhcmhuZGtlcGZtaGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5OTM2MjEsImV4cCI6MjEwNjU2OTYyMX0.vFRBR-CnVZ6RrEpXk8QkFq1shOCkJ-K0UZOkh8P8Z78';
    const DOMINIO_INTERNO = '@tianguis.app';
    const RUTA_PANEL = 'panel.html';

    // ===== Helpers de UI =====
    const formLogin   = document.getElementById('form-login');
    const inputUsuario = document.getElementById('usuario');
    const inputPassword = document.getElementById('password');
    const btn = document.getElementById('btn-login');
    const errorMsg = document.getElementById('error-msg');
    const togglePass = document.getElementById('toggle-pass');

    function mostrarError(texto) {
      errorMsg.textContent = texto;
      errorMsg.style.display = 'block';
    }
    function ocultarError() {
      errorMsg.textContent = '';
      errorMsg.style.display = 'none';
    }
    function setCargando(cargando) {
      btn.disabled = cargando;
      inputUsuario.disabled = cargando;
      inputPassword.disabled = cargando;
      btn.setAttribute('aria-busy', cargando ? 'true' : 'false');
      btn.textContent = cargando ? 'Verificando...' : 'Iniciar Sesión';
    }
    function setExito() {
      btn.textContent = '¡Bienvenido!';
      btn.classList.add('success');
    }

    function traducirError(err) {
      const msg = (err && err.message ? err.message : '').toLowerCase();
      const status = err && err.status;

      if (msg.includes('invalid login credentials') || status === 400) {
        return 'Usuario o contraseña incorrectos.';
      }
      if (msg.includes('email not confirmed')) {
        return 'Tu cuenta aún no está activada. Contacta al administrador.';
      }
      if (status === 429 || msg.includes('rate limit')) {
        return 'Demasiados intentos. Espera un momento e inténtalo de nuevo.';
      }
      if (
        (err && err.name === 'AuthRetryableFetchError') ||
        msg.includes('failed to fetch') ||
        msg.includes('network')
      ) {
        return 'No hay conexión con el servidor. Revisa tu internet.';
      }
      return 'No se pudo iniciar sesión. Inténtalo de nuevo.';
    }

    // ===== Inicialización de Supabase (aislada) =====
    let supabaseClient = null;
    let errorInicializacion = null;

    try {
      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        throw new Error('La librería de Supabase no se cargó (revisa tu conexión o el CDN).');
      }
      if (!/^https?:\/\//i.test(SUPABASE_URL)) {
        throw new Error('SUPABASE_URL no es una URL válida.');
      }
      if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.startsWith('AQUI_PON')) {
        throw new Error('Falta configurar SUPABASE_ANON_KEY.');
      }
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      errorInicializacion = err;
      console.error('Error al inicializar Supabase:', err);
    }

    // ===== Verificar sesión activa al cargar =====
    // Si el locatario ya inició sesión antes, no le mostramos el formulario:
    // lo mandamos directo al panel. Esto evita que tenga que escribir sus
    // datos cada vez que vuelve a abrir la página.
    (async function redirigirSiHaySesion() {
      if (!supabaseClient) return;
      try {
        const { data } = await supabaseClient.auth.getSession();
        if (data && data.session) {
          window.location.href = RUTA_PANEL;
        }
      } catch (err) {
        // Silencioso: si falla, simplemente se muestra el formulario normal
        console.warn('No se pudo verificar la sesión activa:', err);
      }
    })();

    // ===== Mostrar / ocultar contraseña =====
    togglePass.addEventListener('click', function () {
      const mostrando = inputPassword.type === 'text';
      inputPassword.type = mostrando ? 'password' : 'text';
      togglePass.textContent = mostrando ? '👁' : '🙈';
      togglePass.setAttribute('aria-pressed', String(!mostrando));
      togglePass.setAttribute('aria-label', mostrando ? 'Mostrar contraseña' : 'Ocultar contraseña');
      togglePass.title = mostrando ? 'Mostrar contraseña' : 'Ocultar contraseña';
      inputPassword.focus();
    });

    // ===== Envío del formulario =====
    formLogin.addEventListener('submit', async function (e) {
      e.preventDefault();
      ocultarError();

      if (!supabaseClient) {
        mostrarError('El sistema no está disponible por ahora. Inténtalo más tarde.');
        console.error('Cliente de Supabase no disponible:', errorInicializacion);
        return;
      }

      // Normalizar usuario: minúsculas, sin espacios, sin dominio interno
      const usuario = inputUsuario.value
        .trim()
        .toLowerCase()
        .replace(new RegExp(DOMINIO_INTERNO.replace('.', '\\.') + '$'), '')
        .replace(/\s+/g, '');
      const password = inputPassword.value;

      if (!usuario || !password) {
        mostrarError('Escribe tu usuario y contraseña.');
        return;
      }

      setCargando(true);

      try {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: usuario + DOMINIO_INTERNO,
          password: password,
        });

        if (error) throw error;

        // Éxito: damos feedback visual antes de redirigir
        setExito();

        // localStorage puede fallar (modo privado, almacenamiento bloqueado)
        try {
          localStorage.setItem('localActivo', usuario);
        } catch (storageErr) {
          console.warn('No se pudo guardar en localStorage:', storageErr);
        }

        setTimeout(function () {
          window.location.href = RUTA_PANEL;
        }, 900);

      } catch (err) {
        console.error('Detalle del error:', err);
        setCargando(false);
        mostrarError(traducirError(err));
      }
    });

    // ===== Foco automático al cargar =====
    inputUsuario.focus();
  </script>
</body>
</html>
